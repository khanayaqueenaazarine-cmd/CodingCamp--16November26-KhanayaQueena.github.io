<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────── TOP BAR ───────────── -->
    <header class="topbar">
      <div class="topbar-left">
        <span id="greeting-text">Good morning</span>,
        <span id="user-name" class="editable-name" title="Click to change name">Friend</span>
        <button class="icon-btn" id="edit-name-btn" title="Edit name">✏️</button>
      </div>
      <div class="topbar-center">
        <div id="clock">00:00:00</div>
        <div id="date-display">Monday, 1 January 2025</div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="theme-toggle" title="Toggle light/dark mode">🌙</button>
      </div>
    </header>

    <!-- Name edit modal -->
    <div id="name-modal" class="modal hidden">
      <div class="modal-box">
        <h3>What's your name?</h3>
        <input type="text" id="name-input" placeholder="Enter your name" maxlength="30" />
        <div class="modal-actions">
          <button id="name-save-btn" class="btn btn-primary">Save</button>
          <button id="name-cancel-btn" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ───────────── MAIN GRID ───────────── -->
    <main class="dashboard">

      <!-- FOCUS TIMER -->
      <section class="card timer-card">
        <h2 class="card-title">⏱ Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button class="btn btn-primary" id="timer-start">Start</button>
          <button class="btn btn-secondary" id="timer-stop">Stop</button>
          <button class="btn btn-ghost" id="timer-reset">Reset</button>
        </div>
        <div class="timer-settings">
          <label for="timer-duration">Duration (min):</label>
          <input type="number" id="timer-duration" min="1" max="120" value="25" />
          <button class="btn btn-ghost btn-sm" id="timer-set">Set</button>
        </div>
        <div id="timer-status" class="timer-status"></div>
      </section>

      <!-- TO-DO LIST -->
      <section class="card todo-card">
        <h2 class="card-title">✅ To-Do List</h2>
        <div class="todo-input-row">
          <input type="text" id="todo-input" placeholder="Add a new task…" maxlength="120" />
          <button class="btn btn-primary" id="todo-add-btn">Add</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-empty" class="empty-hint">No tasks yet. Add one above!</p>
      </section>

      <!-- QUICK LINKS -->
      <section class="card links-card">
        <h2 class="card-title">🔗 Quick Links</h2>
        <div class="links-input-row">
          <input type="text" id="link-name-input" placeholder="Label" maxlength="30" />
          <input type="url" id="link-url-input" placeholder="https://…" maxlength="300" />
          <button class="btn btn-primary" id="link-add-btn">Add</button>
        </div>
        <div id="links-grid" class="links-grid"></div>
        <p id="links-empty" class="empty-hint">No links yet. Add your favorites!</p>
      </section>

    </main>

    <!-- Edit task modal -->
    <div id="edit-modal" class="modal hidden">
      <div class="modal-box">
        <h3>Edit Task</h3>
        <input type="text" id="edit-input" maxlength="120" />
        <div class="modal-actions">
          <button id="edit-save-btn" class="btn btn-primary">Save</button>
          <button id="edit-cancel-btn" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
